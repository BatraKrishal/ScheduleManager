services:
  postgres:
    image: postgres:16-alpine
    container_name: primavera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-primavera}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - p6-network

  document-parser:
    build:
      context: ./document-parser
      dockerfile: Dockerfile
    container_name: primavera-document-parser
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    networks:
      - p6-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: primavera-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-primavera}
      - PARSER_URL=http://document-parser:8001
    depends_on:
      postgres:
        condition: service_healthy
      document-parser:
        condition: service_started
    networks:
      - p6-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: primavera-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    networks:
      - p6-network

networks:
  p6-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
